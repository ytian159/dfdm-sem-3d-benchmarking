longitude_deg = [-2.416296702, -6.659416891, -11.421924891, -17.085831739, -24.254833852, -33.935128160, -47.736830382, -67.445202974, -92.094470074, -115.524897998, -133.080331609, -145.251232891, -153.923205028, -160.488344239, -165.789616097, -170.338640473, -174.468993733, -176.455385274]

