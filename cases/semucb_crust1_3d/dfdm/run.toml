# DFDM run file: SEMUCB-WM1 mantle with CRUST1.0 on top, a shear earthquake (Mrp) at 50 km depth under 6N 12E,
# half duration 80 s, 4800 s of records at 90 stations (the 12E meridian and six more azimuths).
# Written by the DFDM3D mesh planner: python3 -m automesh shells (the layout), automesh near-source (more points
# in depth and shorter time steps in the 3 x 3 columns around the earthquake, crust base bent onto the smoothed
# Moho there) and automesh steps-from-probe (time steps from the solver's measured stability limit).
# scripts/run_benchmark.sh fills in @OUTPUT_DIR@, @MODEL_DIR@ (scripts/get_3d_models.sh) and @RUN_DIR@.

[simulation]
lts_short_steps = 3
lts_fine_patch = true
lts_overlap = 1
lts_stabilize = 0.05
dt = 0.2713
nt = 17694
output_dir = "@OUTPUT_DIR@"

